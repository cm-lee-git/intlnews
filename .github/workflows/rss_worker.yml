name: Update RSS Feed

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 자동 실행 (UTC 0시 = 한국 오전 9시)
  workflow_dispatch:       # 수동 실행 버튼 활성화

permissions:
  contents: write          # gh-pages 브랜치에 push하기 위한 쓰기 권한

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install feedparser rfeed googlenewsdecoder

      - name: Run RSS Script
        run: |
          python make_rss.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
